# Pipeline CI/CD da FCG Users API
# Etapas: Build & Test -> Build da imagem Docker -> Push para o ACR
#        -> Deploy no AKS com Rolling Update (manifestos do repositório FCG-ORCHESTRATION-API)

trigger:
  branches:
    include:
      - main

pr: none

resources:
  repositories:
    - repository: orchestration          # manifestos Kubernetes compartilhados
      type: git
      name: FCG-FIAP-TECH4/FCG-ORCHESTRATION-API
      ref: refs/heads/main

pool:
  vmImage: ubuntu-24.04

variables:
  dockerRegistryServiceConnection: 'acr-fcg'          # nome da service connection criada no Azure DevOps
  containerRegistry: 'acrfcgfiap.azurecr.io'
  imageRepository: 'fcg-users-api'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  solution: 'FCG.Users.slnx'
  buildConfiguration: 'Release'
  tag: '$(Build.BuildId)'                             # versão da imagem = número do build
  k8sNamespace: 'fcg'
  k8sDeployment: 'users-api'

stages:
  - stage: BuildAndTest
    displayName: 'Build & Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Compilar e rodar testes unitários'
        steps:
          - task: UseDotNet@2
            displayName: 'Instalar .NET 10 SDK'
            inputs:
              packageType: 'sdk'
              version: '10.0.x'

          - script: dotnet restore $(solution)
            displayName: 'dotnet restore'

          - script: dotnet build $(solution) --configuration $(buildConfiguration) --no-restore
            displayName: 'dotnet build'

          - script: >
              dotnet test $(solution)
              --configuration $(buildConfiguration)
              --no-build
              --logger trx
              --results-directory $(Agent.TempDirectory)/TestResults
            displayName: 'dotnet test'

          - task: PublishTestResults@2
            displayName: 'Publicar resultados dos testes'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/*.trx'
              searchFolder: '$(Agent.TempDirectory)/TestResults'

  - stage: Docker
    displayName: 'Build & Push da imagem'
    dependsOn: BuildAndTest
    condition: succeeded()
    jobs:
      - job: Docker
        displayName: 'Docker build e push para o ACR'
        steps:
          - task: Docker@2
            displayName: 'Build e push da imagem'
            inputs:
              command: buildAndPush
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              buildContext: '$(Build.SourcesDirectory)'
              tags: |
                $(tag)
                latest

  - stage: Deploy
    displayName: 'Deploy no AKS (Rolling Update)'
    dependsOn: Docker
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Deploy
        displayName: 'Atualizar users-api no cluster'
        steps:
          - checkout: orchestration

          - task: DownloadSecureFile@1
            name: kubeconfig
            displayName: 'Baixar kubeconfig (Secure File)'
            inputs:
              secureFile: 'kubeconfig-aks-fcg.yaml'

          - bash: echo "##vso[task.setvariable variable=KUBECONFIG]$(kubeconfig.secureFilePath)"
            displayName: 'Login no AKS'

          - bash: |
              set -euo pipefail
              # Gera o manifesto com a imagem desta build (tag versionada no ACR)
              sed "s|IMAGE_TAG|$(tag)|g" k8s/users-deployment.yaml > "$AGENT_TEMPDIRECTORY/users-deployment.yaml"
              grep "image: $(containerRegistry)" "$AGENT_TEMPDIRECTORY/users-deployment.yaml"

              kubectl -n $(k8sNamespace) apply -f "$AGENT_TEMPDIRECTORY/users-deployment.yaml" -f k8s/users-service.yaml
            displayName: 'Aplicar manifestos com a nova imagem'

          - bash: |
              set -euo pipefail
              kubectl -n $(k8sNamespace) rollout status deployment/$(k8sDeployment) --timeout=10m
              kubectl -n $(k8sNamespace) get pods -l app=$(k8sDeployment) -o wide
            displayName: 'Aguardar Rolling Update'